<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b27">
  <meta name="description" content="异物航线：角色、界面与动态演出。指派远航员，选择航线，揭开遗物的故事。">
  <title>异物航线 · RELIC ROUTE — 可交互原型</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="portrait-note">本作品按 PC 游戏的 16:9 界面设计。手机建议横屏观看，或在作品页查看界面图与短片。</div>
    <div id="stage" class="stage" aria-label="异物航线游戏界面">
      <canvas id="game" width="1600" height="900" aria-hidden="true"></canvas>
      <div id="controls" class="controls"></div>
      <section class="sr-only" aria-label="当前界面信息"><h1 id="screen-title">载入异物航线</h1><p id="screen-description"></p></section>
      <div class="loading" id="loading"><span class="loading-symbol">◎</span><p>正在建立航线</p><small>RELIC ROUTE</small></div>
    </div>
    <div class="demo-bar">
      <a href="../index.html" class="back-link">↗ 作品说明</a>
      <span class="demo-label">游戏 UI 概念演示 <i></i> 无需真实任务等待</span>
      <div class="demo-actions">
        <button id="motion" aria-pressed="false">减少动态效果</button>
        <button id="sound" aria-pressed="false">声音：关</button>
        <button id="film">观看完整演出 <span>↗</span></button>
      </div>
    </div>
    <div id="film-controls" class="film-controls" hidden>
      <button id="pause-film">暂停</button><label>演出时间<input type="range" id="film-time" min="0" max="30" step="0.1" value="0"></label><output id="film-time-label">00:00 / 00:30</output><button id="exit-film">返回操作</button>
    </div>
    <details id="studio" hidden><summary>作品导出工具</summary><p>使用项目的本地服务保存五张原生界面图和完整演出。导出内容与交互原型共用画面与时间轴。</p><button id="export-frames">保存五张界面图</button><button id="export-film">录制 30 秒演出</button><output id="export-status" role="status"></output></details>
    <p id="announcement" class="sr-only" aria-live="polite"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
